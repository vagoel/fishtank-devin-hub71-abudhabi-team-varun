[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telemetry-api"
version = "0.1.0"
description = "High-throughput time-series ingestion and analytics API for temperature and gyroscope data"
# HeatGuard needs 3.11+ (asyncio.timeout, TimeoutError from asyncio.wait_for).
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "asyncpg>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "numpy>=1.26",
    # HeatGuard: outbound HTTP (Devin, Twilio, weather) and the OpenAI GPT-Live WebSocket client
    "httpx>=0.27",
    "websockets>=15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
]
# HeatGuard LAN mode (HEATGUARD_LAN=1): USB serial bridge to a wearable on the same machine
lan = [
    "pyserial>=3.5",
]

[tool.setuptools.packages.find]
include = ["telemetry*", "heatguard*"]

[tool.setuptools.package-data]
telemetry = ["schema.sql", "static/*"]
heatguard = ["static/*.html"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
