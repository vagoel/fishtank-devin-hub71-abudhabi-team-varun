  <text x="838" y="307" font-family="Menlo, Consolas, monospace" font-size="8" fill="#34d399">72 active</text>
  <rect x="830" y="320" width="65" height="25" rx="3" fill="#162540"/>
  <text x="838" y="337" font-family="Menlo, Consolas, monospace" font-size="8" fill="#ef4444">03 crit</text>
  <!-- Mini incident cards -->
  <rect x="725" y="350" width="85" height="20" rx="3" fill="#162540"/>
  <rect x="815" y="350" width="80" height="20" rx="3" fill="#162540"/>
  <text x="720" y="400" font-family="Menlo, Consolas, monospace" font-size="10" fill="#64748b">React 19  ·  Vite 8</text>
  <text x="720" y="420" font-family="Menlo, Consolas, monospace" font-size="10" fill="#64748b">MapLibre  ·  Three.js</text>
  <text x="720" y="440" font-family="Menlo, Consolas, monospace" font-size="10" fill="#64748b">GPT-Live-1 voice</text>
  <text x="720" y="468" font-family="Menlo, Consolas, monospace" font-size="9" fill="#475569">Real-time incident control</text>

  <!-- Card 4: AI + Integrations (right side, smaller) -->
  <rect x="960" y="230" width="185" height="250" rx="14" fill="url(#cardBg2)" stroke="#2a3f5f" stroke-width="1"/>
  <rect x="960" y="230" width="185" height="40" rx="14" fill="#1a3350"/>
  <circle cx="985" cy="250" r="10" fill="#ec4899" opacity="0.9"/>
  <text x="1003" y="256" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#f472b6">AI + COMMS</text>
  <!-- Devin -->
  <rect x="980" y="285" width="145" height="40" rx="6" fill="#1e3a5f"/>
  <text x="995" y="302" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#a78bfa">Devin</text>
  <text x="995" y="317" font-family="Menlo, Consolas, monospace" font-size="9" fill="#64748b">Incident analysis</text>
  <!-- OpenAI -->
  <rect x="980" y="335" width="145" height="40" rx="6" fill="#1e3a5f"/>
  <text x="995" y="352" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#22d3ee">OpenAI</text>
  <text x="995" y="367" font-family="Menlo, Consolas, monospace" font-size="9" fill="#64748b">Voice (any language)</text>
  <!-- WhatsApp -->
  <rect x="980" y="385" width="145" height="40" rx="6" fill="#1e3a5f"/>
  <text x="995" y="402" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#34d399">WhatsApp</text>
  <text x="995" y="417" font-family="Menlo, Consolas, monospace" font-size="9" fill="#64748b">Escalation + map pin</text>
