  <text x="995" y="455" font-family="Menlo, Consolas, monospace" font-size="9" fill="#64748b">Open-Meteo WBGT</text>

  <!-- Arrow 3 → 4 -->
  <line x1="930" y1="355" x2="955" y2="355" stroke="url(#arrow)" stroke-width="2"/>

  <!-- ========== Bottom strip ========== -->
  <rect x="0" y="530" width="1200" height="1" fill="#2a3f5f" opacity="0.5"/>

  <!-- Track badges -->
  <text x="60" y="570" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#94a3b8">HACKATHON TRACKS</text>
  <rect x="60" y="585" width="115" height="28" rx="6" fill="#1e3a5f" stroke="#34d399" stroke-width="0.8"/>
  <text x="75" y="604" font-family="Menlo, Consolas, monospace" font-size="10" fill="#34d399">Healthtech</text>
  <rect x="185" y="585" width="195" height="28" rx="6" fill="#1e3a5f" stroke="#06b6d4" stroke-width="0.8"/>
  <text x="200" y="604" font-family="Menlo, Consolas, monospace" font-size="10" fill="#06b6d4">Climate &amp; Sustainability</text>
  <rect x="390" y="585" width="145" height="28" rx="6" fill="#1e3a5f" stroke="#a78bfa" stroke-width="0.8"/>
  <text x="405" y="604" font-family="Menlo, Consolas, monospace" font-size="10" fill="#a78bfa">Arabic-native AI</text>
  <rect x="545" y="585" width="190" height="28" rx="6" fill="#1e3a5f" stroke="#f472b6" stroke-width="0.8"/>
  <text x="560" y="604" font-family="Menlo, Consolas, monospace" font-size="10" fill="#f472b6">Security &amp; Governance</text>

  <!-- Key stats row -->
  <text x="60" y="660" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#94a3b8">CAPABILITIES</text>
  <rect x="60" y="675" width="150" height="48" rx="8" fill="#0f1a2e" stroke="#2a3f5f" stroke-width="0.8"/>
  <text x="75" y="695" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#34d399">50 Hz</text>
  <text x="75" y="713" font-family="Menlo, Consolas, monospace" font-size="9" fill="#64748b">IMU sampling rate</text>

  <rect x="225" y="675" width="150" height="48" rx="8" fill="#0f1a2e" stroke="#2a3f5f" stroke-width="0.8"/>
  <text x="240" y="695" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#06b6d4">1,200</text>
  <text x="240" y="713" font-family="Menlo, Consolas, monospace" font-size="9" fill="#64748b">Simulated workers</text>

  <rect x="390" y="675" width="150" height="48" rx="8" fill="#0f1a2e" stroke="#2a3f5f" stroke-width="0.8"/>
  <text x="405" y="695" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#f59e0b">15s</text>
  <text x="405" y="713" font-family="Menlo, Consolas, monospace" font-size="9" fill="#64748b">"Are you OK?" window</text>

  <rect x="555" y="675" width="150" height="48" rx="8" fill="#0f1a2e" stroke="#2a3f5f" stroke-width="0.8"/>
  <text x="570" y="695" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#a78bfa">6+</text>
  <text x="570" y="713" font-family="Menlo, Consolas, monospace" font-size="9" fill="#64748b">Languages supported</text>

  <rect x="720" y="675" width="150" height="48" rx="8" fill="#0f1a2e" stroke="#2a3f5f" stroke-width="0.8"/>
  <text x="735" y="695" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#ec4899">2s</text>
  <text x="735" y="713" font-family="Menlo, Consolas, monospace" font-size="9" fill="#64748b">SOS response time</text>

  <!-- Bottom footer -->
  <text x="60" y="770" font-family="Menlo, Consolas, monospace" font-size="11" fill="#475569">M5Stack StickS3  ·  FastAPI  ·  React 19  ·  Devin  ·  GPT-Live-1  ·  WhatsApp  ·  Open-Meteo  ·  MapLibre</text>

  <!-- Arrowhead marker -->
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#34d399" opacity="0.8"/>
    </marker>
  </defs>
</svg>
