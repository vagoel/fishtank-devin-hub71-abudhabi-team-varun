  <circle cx="760" cy="315" r="4" fill="#34d399" opacity="0.7"/>
  <circle cx="780" cy="308" r="3" fill="#f59e0b" opacity="0.7"/>
  <circle cx="800" cy="325" r="3" fill="#ef4444" opacity="0.7"/>
