<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#16233f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="cardBg1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2744"/>
      <stop offset="100%" stop-color="#14203a"/>
    </linearGradient>
    <linearGradient id="cardBg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e2f4a"/>
      <stop offset="100%" stop-color="#162540"/>
    </linearGradient>
    <linearGradient id="warnGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g stroke="#3b82f6" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="0" x2="0" y2="800"/><line x1="60" y1="0" x2="60" y2="800"/>
    <line x1="120" y1="0" x2="120" y2="800"/><line x1="180" y1="0" x2="180" y2="800"/>
    <line x1="240" y1="0" x2="240" y2="800"/><line x1="300" y1="0" x2="300" y2="800"/>
    <line x1="360" y1="0" x2="360" y2="800"/><line x1="420" y1="0" x2="420" y2="800"/>
    <line x1="480" y1="0" x2="480" y2="800"/><line x1="540" y1="0" x2="540" y2="800"/>
    <line x1="600" y1="0" x2="600" y2="800"/><line x1="660" y1="0" x2="660" y2="800"/>
    <line x1="720" y1="0" x2="720" y2="800"/><line x1="780" y1="0" x2="780" y2="800"/>
    <line x1="840" y1="0" x2="840" y2="800"/><line x1="900" y1="0" x2="900" y2="800"/>
    <line x1="960" y1="0" x2="960" y2="800"/><line x1="1020" y1="0" x2="1020" y2="800"/>
    <line x1="1080" y1="0" x2="1080" y2="800"/><line x1="1140" y1="0" x2="1140" y2="800"/>
    <line x1="0" y1="60" x2="1200" y2="60"/><line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/><line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/><line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="420" x2="1200" y2="420"/><line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="540" x2="1200" y2="540"/><line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="0" y1="660" x2="1200" y2="660"/><line x1="0" y1="720" x2="1200" y2="720"/>
  </g>

  <!-- Title -->
  <text x="60" y="95" font-family="Helvetica, Arial, sans-serif" font-size="58" font-weight="bold" fill="#ffffff" letter-spacing="-1">HeatGuard</text>
  <rect x="60" y="110" width="220" height="4" rx="2" fill="url(#accent)"/>
  <text x="60" y="150" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#94a3b8">Keeping construction workers safe from heat &amp; falls</text>
  <text x="60" y="180" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#64748b">Abu Dhabi  ·  Fishtank x Hub71 Hackathon  ·  Built with Devin</text>

  <!-- Badge top-right -->
  <rect x="960" y="55" width="185" height="36" rx="18" fill="#1e3a5f" stroke="#34d399" stroke-width="1.5"/>
  <circle cx="981" cy="73" r="5" fill="#34d399"/>
  <text x="995" y="79" font-family="Menlo, Consolas, monospace" font-size="12" fill="#34d399">HACKATHON PROJECT</text>

  <!-- ========== Flow cards ========== -->

  <!-- Card 1: Wearable Device -->
  <rect x="60" y="230" width="220" height="250" rx="14" fill="url(#cardBg1)" stroke="#2a3f5f" stroke-width="1"/>
  <rect x="60" y="230" width="220" height="40" rx="14" fill="#1a3350"/>
  <rect x="140" y="270" width="140" height="0" rx="0" fill="none"/>
  <circle cx="85" cy="250" r="10" fill="#f59e0b" opacity="0.9"/>
  <text x="103" y="256" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#fbbf24">WEARABLE</text>
  <!-- Mini IMU wave -->
  <polyline points="80,300 100,285 120,310 140,280 160,305 180,290 200,315 220,288 240,300 260,295" fill="none" stroke="#34d399" stroke-width="1.5" opacity="0.7"/>
  <text x="80" y="340" font-family="Menlo, Consolas, monospace" font-size="10" fill="#64748b">ESP32-S3  ·  BMI270 IMU</text>
  <text x="80" y="360" font-family="Menlo, Consolas, monospace" font-size="10" fill="#64748b">50 Hz motion sampling</text>
  <!-- Detection items -->
  <rect x="80" y="380" width="70" height="22" rx="4" fill="#1e3a5f"/>
  <text x="89" y="395" font-family="Menlo, Consolas, monospace" font-size="9" fill="#f59e0b">FALL</text>
  <rect x="158" y="380" width="70" height="22" rx="4" fill="#1e3a5f"/>
  <text x="165" y="395" font-family="Menlo, Consolas, monospace" font-size="9" fill="#f59e0b">HEAT</text>
  <rect x="80" y="410" width="70" height="22" rx="4" fill="#1e3a5f"/>
  <text x="89" y="425" font-family="Menlo, Consolas, monospace" font-size="9" fill="#f59e0b">TREMOR</text>
  <rect x="158" y="410" width="70" height="22" rx="4" fill="#1e3a5f"/>
  <text x="168" y="425" font-family="Menlo, Consolas, monospace" font-size="9" fill="#f59e0b">SOS</text>
  <text x="80" y="460" font-family="Menlo, Consolas, monospace" font-size="9" fill="#475569">"Are you OK?" 15s prompt</text>

  <!-- Arrow 1 → 2 -->
  <line x1="290" y1="355" x2="370" y2="355" stroke="url(#arrow)" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="295" y="345" font-family="Menlo, Consolas, monospace" font-size="9" fill="#34d399" opacity="0.8">UDP</text>

  <!-- Card 2: Gateway Server -->
  <rect x="380" y="230" width="220" height="250" rx="14" fill="url(#cardBg2)" stroke="#2a3f5f" stroke-width="1"/>
  <rect x="380" y="230" width="220" height="40" rx="14" fill="#1a3350"/>
  <circle cx="405" cy="250" r="10" fill="#06b6d4" opacity="0.9"/>
  <text x="423" y="256" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#22d3ee">GATEWAY</text>
  <!-- Mini bar chart -->
  <rect x="400" y="310" width="12" height="30" rx="2" fill="#34d399" opacity="0.5"/>
  <rect x="420" y="295" width="12" height="45" rx="2" fill="#34d399" opacity="0.6"/>
  <rect x="440" y="305" width="12" height="35" rx="2" fill="#34d399" opacity="0.5"/>
  <rect x="460" y="285" width="12" height="55" rx="2" fill="#34d399" opacity="0.7"/>
  <rect x="480" y="300" width="12" height="40" rx="2" fill="#34d399" opacity="0.5"/>
  <rect x="500" y="290" width="12" height="50" rx="2" fill="#06b6d4" opacity="0.6"/>
  <rect x="520" y="315" width="12" height="25" rx="2" fill="#06b6d4" opacity="0.5"/>
  <rect x="540" y="302" width="12" height="38" rx="2" fill="#06b6d4" opacity="0.5"/>
  <rect x="560" y="295" width="12" height="45" rx="2" fill="#06b6d4" opacity="0.6"/>
  <text x="400" y="365" font-family="Menlo, Consolas, monospace" font-size="10" fill="#64748b">FastAPI  ·  Python</text>
  <text x="400" y="385" font-family="Menlo, Consolas, monospace" font-size="10" fill="#64748b">WBGT heat engine</text>
  <text x="400" y="405" font-family="Menlo, Consolas, monospace" font-size="10" fill="#64748b">1,200-worker sim fleet</text>
  <rect x="400" y="420" width="175" height="22" rx="4" fill="#1e3a5f"/>
  <text x="410" y="435" font-family="Menlo, Consolas, monospace" font-size="9" fill="#06b6d4">Alert timeline + audit</text>
  <text x="400" y="468" font-family="Menlo, Consolas, monospace" font-size="9" fill="#475569">UDP telemetry + SSE events</text>

  <!-- Arrow 2 → 3 -->
  <line x1="610" y1="355" x2="690" y2="355" stroke="url(#arrow)" stroke-width="2"/>
  <text x="620" y="345" font-family="Menlo, Consolas, monospace" font-size="9" fill="#34d399" opacity="0.8">API</text>

  <!-- Card 3: Dashboard -->
  <rect x="700" y="230" width="220" height="250" rx="14" fill="url(#cardBg1)" stroke="#2a3f5f" stroke-width="1"/>
  <rect x="700" y="230" width="220" height="40" rx="14" fill="#1a3350"/>
  <circle cx="725" cy="250" r="10" fill="#8b5cf6" opacity="0.9"/>
  <text x="743" y="256" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#a78bfa">DASHBOARD</text>
